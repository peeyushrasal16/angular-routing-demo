<nav class="navbar">
  <div class="navbar-inner">
    <a routerLink="/home" class="brand">Angular Routing Demo</a>
    <ul class="nav-links">
      @for (link of navLinks; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  </div>
</nav>
